name: Build Ribbon RC1 Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Ribbon JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in *.js; do
            node --check "$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Ribbon RC1 APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Ribbon-RC1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Ribbon-RC1.apk
          sha256sum dist/Ribbon-RC1.apk | tee dist/Ribbon-RC1.apk.sha256

      - name: Upload Ribbon RC1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ribbon-RC1-APK
          path: |
            dist/Ribbon-RC1.apk
            dist/Ribbon-RC1.apk.sha256
          if-no-files-found: error
          retention-days: 30
